<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Tasks · Task Management</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-screen bg-slate-50">
  <div class="max-w-2xl mx-auto p-4 sm:p-8">
    <header class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold text-slate-900">My Tasks</h1>
      <div class="flex items-center gap-3">
        <span id="user-email" class="text-sm text-slate-500"></span>
        <button id="logout-btn" type="button"
          class="text-sm font-medium text-slate-600 hover:text-slate-900 border border-slate-300 rounded-md px-3 py-1.5">
          Log out
        </button>
      </div>
    </header>

    <p id="app-error" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2"></p>

    <form id="new-task-form" class="bg-white border border-slate-200 rounded-lg shadow-sm p-4 mb-6 space-y-3">
      <div>
        <label for="task-title" class="sr-only">Task title</label>
        <input id="task-title" name="title" type="text" required maxlength="200" placeholder="What needs to be done?"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
      </div>
      <div>
        <label for="task-description" class="sr-only">Description (optional)</label>
        <textarea id="task-description" name="description" rows="2" maxlength="2000" placeholder="Details (optional)"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900"></textarea>
      </div>
      <button type="submit"
        class="bg-slate-900 text-white text-sm font-medium py-2 px-4 rounded-md hover:bg-slate-800 transition">
        Add Task
      </button>
    </form>

    <div class="flex gap-2 mb-4" role="tablist" aria-label="Filter tasks">
      <button type="button" data-filter="all"
        class="filter-btn text-sm font-medium px-3 py-1.5 rounded-md bg-slate-900 text-white" aria-selected="true">
        All
      </button>
      <button type="button" data-filter="pending"
        class="filter-btn text-sm font-medium px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100" aria-selected="false">
        Active
      </button>
      <button type="button" data-filter="completed"
        class="filter-btn text-sm font-medium px-3 py-1.5 rounded-md text-slate-600 hover:bg-slate-100" aria-selected="false">
        Completed
      </button>
    </div>

    <p id="empty-state" class="hidden text-sm text-slate-400 text-center py-10">No tasks yet. Add one above.</p>
    <ul id="task-list" class="space-y-2"></ul>

    <template id="task-item-template">
      <li class="task-item bg-white border border-slate-200 rounded-lg p-3 flex items-start gap-3" data-id="">
        <input type="checkbox" class="task-toggle mt-1 h-4 w-4 rounded border-slate-300" />
        <div class="flex-1 min-w-0">
          <p class="task-title text-sm font-medium text-slate-900 break-words"></p>
          <p class="task-description text-sm text-slate-500 break-words"></p>
        </div>
        <button type="button" class="task-delete text-slate-400 hover:text-red-600 text-sm" aria-label="Delete task">
          Delete
        </button>
      </li>
    </template>
  </div>

  <script src="/js/vendor/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/tasks.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
