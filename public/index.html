<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Task Management</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
  <main class="w-full max-w-sm">
    <h1 class="text-2xl font-semibold text-slate-900 mb-1 text-center">Task Management</h1>
    <p class="text-slate-500 text-sm mb-6 text-center">Sign in to manage your tasks</p>

    <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-6">
      <div class="flex mb-6 rounded-md bg-slate-100 p-1" role="tablist">
        <button type="button" id="tab-signin" role="tab" aria-selected="true"
          class="flex-1 text-sm font-medium py-1.5 rounded-md bg-white shadow-sm text-slate-900">
          Sign In
        </button>
        <button type="button" id="tab-signup" role="tab" aria-selected="false"
          class="flex-1 text-sm font-medium py-1.5 rounded-md text-slate-500">
          Sign Up
        </button>
      </div>

      <p id="auth-error" class="hidden mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded-md px-3 py-2"></p>
      <p id="auth-notice" class="hidden mb-4 text-sm text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-md px-3 py-2"></p>

      <form id="signin-form" class="space-y-4">
        <div>
          <label for="signin-email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input id="signin-email" name="email" type="email" required autocomplete="email"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
        </div>
        <div>
          <label for="signin-password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input id="signin-password" name="password" type="password" required autocomplete="current-password"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
        </div>
        <button type="submit"
          class="w-full bg-slate-900 text-white text-sm font-medium py-2 rounded-md hover:bg-slate-800 transition">
          Sign In
        </button>
      </form>

      <form id="signup-form" class="space-y-4 hidden">
        <div>
          <label for="signup-email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input id="signup-email" name="email" type="email" required autocomplete="email"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
        </div>
        <div>
          <label for="signup-password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input id="signup-password" name="password" type="password" required minlength="6" autocomplete="new-password"
            class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900" />
          <p class="text-xs text-slate-400 mt-1">At least 6 characters.</p>
        </div>
        <button type="submit"
          class="w-full bg-slate-900 text-white text-sm font-medium py-2 rounded-md hover:bg-slate-800 transition">
          Create Account
        </button>
      </form>
    </div>
  </main>

  <script src="/js/vendor/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
